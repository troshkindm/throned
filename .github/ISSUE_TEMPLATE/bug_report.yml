name: Bug report
description: "Report Throned bug"
body:
  - type: markdown
    attributes:
      value: |
        **Program → Copy Diagnostics** puts your version, mode, DNS settings and the tail of the
        log into the clipboard in one go, with secrets and subscription links masked. Pasting that
        below usually answers most of the questions on this form.
  - type: textarea
    attributes:
      label: Diagnostics
      description: Output of Program → Copy Diagnostics, if your build has it.
      render: text
    validations:
      required: false
  - type: dropdown
    attributes:
      label: Operating system
      description: Operating system type
      options:
        - Windows
        - Linux
        - macOS
    validations:
      required: true
  - type: input
    attributes:
      label: System version
      description: Please provide the operating system version
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Installation type
      description: Please provide the Throned installation type
      options:
        - zip
        - exe
        - deb
        - package manager
    validations:
      required: true
  - type: input
    attributes:
      label: Version
      description: Throned version.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Description
      description: Please provide a detailed description of the error.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Reproduction
      description: Please provide the steps to reproduce the error.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Logs
      description: Please provide logs.
      render: shell